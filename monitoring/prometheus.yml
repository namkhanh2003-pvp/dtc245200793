global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    project: recipe-website
    student_id: dtc245200793

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    # Keep only this Compose project, not the user's unrelated Docker projects.
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: recipe-website
        action: keep

  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]

  - job_name: mysql
    static_configs:
      - targets: [mysqld-exporter:9104]

  - job_name: blackbox
    static_configs:
      - targets: [blackbox-exporter:9115]

  - job_name: website
    metrics_path: /probe
    params:
      module: [http_recipe]
    static_configs:
      - targets: [http://nginx:8080/index.php]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
