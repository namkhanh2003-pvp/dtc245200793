# Compose reads this file automatically alongside docker-compose.yml.
services:
  nginx:
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:18082:9090"
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Chay monitoring/setup.ps1 truoc}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:18083:3000"
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    restart: unless-stopped
    privileged: true
    # Needed to observe the Linux VM cgroups used by Docker Desktop.
    pid: host
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring
    mem_limit: 256m

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=recipe_exporter
      - --no-collect.slave_status
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Chay monitoring/setup.ps1 truoc}
    networks:
      - backend
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
